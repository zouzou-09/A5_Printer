<script>
var D=[{"id": 1, "title": "T01：地图 ≠ 疆域", "summary": "别人告诉你的信息，只是他们眼中的世界。不是世界本身。", "questions": "你在回答这些问题之前，不要翻到后面看答案。 1. 上次你从同学那里听说\"某科老师最近心情不好/对谁有看法\"——你是怎么判断这个消息可不可信的？ 2. 你觉得自己在网上看到的信息里，有多少是你亲自验证过的？", "story": "几个科学家发明了一台超级摄像机，可以拍到任何地方的实时画面。他们把一台送到盲人手上的手机——让盲人\"看\"到了大象。然后科学家问：\"这是什么？\" 盲人说：\"这是……一根柱子！\" 科学家说：\"不对，大象是活的、会动、有鼻子耳朵。\" 盲人说：\"可是它看起来就像柱子啊。\" **问题：盲人错了吗？** 他没撒谎。他看到的确实像柱子。但他只看到了一个侧面就下了结论。**这就是\"地图≠疆域\"——每个人手上的那部手机就是一张地图，不是完整的现实。**", "concepts": ["### ① 地图和疆域的区别", "- **地图** = 别人说的话、书上写的、新闻里的、热搜上的", "- **疆域** = 你自己的观察、测量数据、直接体验", "### ② 地图有用吗？", "有用。但没有一张地图是完美的。最好的做法是把多张地图叠在一起看，然后用自己的眼睛去核实关键部分。", "### ③ 最危险的事", "当你的\"地图\"和\"疆域\"矛盾时——比如专家告诉你应该这样做，但你自己的经验告诉你会出问题——**优先相信你自己的经验**。因为别人的地图再精确也不是给你的。", "### ⚡ 板书公式", "`信传闻 → 打个问号 → 自己核实 → 形成自己的地图 → 定期更新`"], "formula": ""}, {"id": 2, "title": "T02：能力圈", "summary": "知道自己擅长什么和不擅长什么，比\"什么都想会\"更重要。", "questions": "1. 你觉得自己在哪些事情上\"怎么学都比别人快\"？（别谦虚，说实话） 2. 有没有什么事情是你明明很努力但就是做不好的？", "story": "小明想学游泳。他去了一家健身房报了课。教练带他练了一个月，他进步很快。然后有人对他说：\"你学会游泳了，去吧！\" 小明去了深水区——沉底了。 **问题出在哪？** 他不是没学会游泳，而是只在浅水区学会了蛙泳。**他的能力圈只覆盖了浅水区。** 深水区需要不同的技能：水性、方向感、不慌张。 后来小明花了一个暑假专门练深水——终于成了自由泳高手。他的能力圈扩展了。", "concepts": ["### ① 你的能力圈是画出来的，不是天生的", "没有人天生就会解二次方程或打篮球。能力圈是通过**一次次尝试→失败→改进→成功**画出来的。", "### ② 知道自己圈在哪里很重要", "不是因为你知道之后就不用往外走——而是因为你知道了之后就可以：", "- **在圈内做事时自信一点**（你不会因为害怕而发挥失常）", "- **在圈外做事时小心一点**（你会提前准备而不是硬闯）", "### ③ 能力圈是可以扩大甚至重塑的", "很多人以为自己是\"数学型人格\"或\"文科命\"——这些都是假的。如果你真的愿意花时间，你完全可以重新画自己的圈。", "### ⚡ 板书公式", "`知道我能做什么 → 在那上面做得很强 → 有计划地拓展 → 慢慢变强`"], "formula": ""}, {"id": 3, "title": "T03：第一性原理", "summary": "别靠\"别人怎么做\"来做决定，回到最根本的事实从零开始想。", "questions": "1. 你有没有做过一件\"因为别人都这样做所以我跟着做\"的事？结果怎么样？ 2. \"上课就要坐在教室里听老师讲\"——这一定是最有效的学习方式吗？", "story": "以前你想吃披萨必须打电话订，等送外卖的人来（要40分钟），而且不能选很便宜的店。 然后有人问了三个问题： ① 人们买披萨的根本目的是什么？→ 吃到好吃的披萨 ② 为什么一定要线下买？→ 不需要，只要能把热腾腾的披萨送到家就行 ③ 能不能让送餐更快更便宜？→ 用算法优化路线+开更多小厨房 结果是——外卖平台上的披萨店。不用等40分钟，价格从30块降到15块。 **这个人没用第一性原理之前，以为\"披萨=只能到店定或电话订\"。用了之后他发现这只是实现目的的一种路，不是唯一的路。**", "concepts": ["### ① 两种思维方式", "- **类比思维**：\"A品牌这么做 → 我们也这么做\"（安全但没什么新意）", "- **第一性原理**：\"这件事的本质是什么？达到这个目的最少需要什么？\"（有挑战但可能颠覆一切）", "### ② \"因为一直如此\"是最大的敌人", "当你听到有人说\"我们一直是这样做的\"或者\"这是行业惯例\"的时候——警惕。那通常是惯性在说话，不是在思考。", "### ③ 三步拆解法", "遇到问题时按这个顺序问：", "**我要达成什么目标？**（最核心的那个）", "**要达到这个目标，最基本的条件是什么？**（少一个都不行）", "**现有的做法是在满足这些基本条件的过程中形成的吗？有没有其他方式也能满足？**", "### ⚡ 板书公式", "`目标不变 → 手段可以无限换 → 找到最简单的路径 → 替代旧方法`"], "formula": ""}, {"id": 4, "title": "T04：思想实验", "summary": "在脑子里跑一遍\"如果这样做会怎样\"——不用实际尝试就能预知很多后果。", "questions": "1. 如果你明天可以瞬间移动到地球上任何一个地方，但只能待1小时——你会去哪？为什么？（认真想想，这个练习很重要） 2. \"取消作业\"——你第一个想到的好处是什么？然后呢？有没有可能没想到的坏处？", "story": "物理学家薛定谔想了一个假想的实验：把一只猫关在盒子里，盒子里有一个50%概率会释放毒药的小装置。在打开盒子之前，猫到底是死是活？——答案是**你不需要（也不应该）真的做这个实验来验证，因为你可以在脑子里先想清楚逻辑。** 爱因斯坦也用类似的方法：他问自己\"如果我追上一束光我会看到什么？\"——这个问题后来帮他建立了狭义相对论。**他不需要制造一台超光速飞机来做实验。**", "concepts": ["### ① 思想实验怎么做？", "**提出假设**：\"如果……会怎样？\"", "**列出前提条件**：哪些事我们默认是真的？", "**逐步推理可能的结果**：A→B→C……", "**得出结论**：这个结果说明了什么？", "### ② 为什么用它？", "- 很多事不能或不应该在现实中尝试（太危险、太贵、不道德）", "- 可以快速探索多个可能性而不用实际投入资源", "- 能暴露出那些被忽略的逻辑漏洞", "### ③ 关键洞见", "最好的思想实验往往从一个简单的\"如果……会怎样\"开始——不要一开始就追求复杂，简单的问题经常有深刻的启示。", "### ⚡ 板书公式", "`如果______ → 那么______ → 然后呢？→ 这意味着什么？`"], "formula": ""}, {"id": 5, "title": "T05：二阶思维", "summary": "做任何决定之前先想清楚\"然后呢？然后呢？然后呢？\"——大多数人只想到第一层，你想深两层就能赢。", "questions": "1. 你有没有做过一件事觉得\"当时觉得挺好\"结果后来发现其实不太好？ 2. 作弊的好处是一时的——这个大家都懂。但你能不能推演一下如果学校加大处罚力度会怎样？更严重会怎样？", "story": "小王中了双色球头奖，拿了500万。他高兴坏了：换大房子、买车、辞掉工作天天旅游。 第一年：爽翻天，每天睡到自然醒，去哪里都是头等舱。 第二年：朋友开始借钱了，亲戚也来找投资了，他不知道怎么拒绝。 第三年：钱花得差不多了，他不会理财，亏了。没有了原来的工资收入。 第五年：500万没了，还欠了不少债。 **小王的决策问题在哪？** 他只想了第一步（中彩票→有钱了很爽）。他没想过第二三步之后会发生什么。这就是缺乏二阶思维。 如果他有二阶思维，他会怎么做？可能先存一部分在安全账户里，学习理财知识，保持基本社交关系……", "concepts": ["### ① 三层后果链", "- **一阶后果** = 直接结果（做了这件事马上会发生什么）", "- **二阶后果** = 间接结果（一阶结果发生后又会发生什么）", "- **三阶后果** = 长期影响（持续下去会变成什么样）", "### ② 为什么大家都不做二阶思考？", "因为一阶思考太舒服了。想到\"我考了高分好开心\"就够了，谁要去想\"然后老师会给更多作业\"\"然后其他同学可能会嫉妒你\"这些烦人的事。但真正聪明的人是会想的。", "### ③ 好消息", "二阶思维是可以训练的。从今天开始，每次做一个重要决定时多问一句\"然后呢？\"至少连问三次。", "### ⚡ 板书公式", "`做决定 → 一阶后果 → 二阶后果 → 三阶后果 → 综合判断是否值得`"], "formula": ""}, {"id": 6, "title": "T06：概率思维", "summary": "世界上很多事情不是\"一定\"或\"不可能\"——学会用几分可能来看待不确定性，做决策就不会那么纠结。", "questions": "1. 明天会不会下雨？你觉得自己有百分之几的概率？你怎么得出这个数字的？ 2. 如果你现在猜一道不会做的选择题的答案，四个选项选一个——你对了吗？概率是多少？", "story": "两个人做了完全不同的选择： **小张**买了一张5块钱的彩票，中奖率万分之一。他知道自己中奖的可能性很小——但他买了。**这不是因为蠢，因为他花5块买的是一种\"万一\"的可能性，而且这5块钱对他没什么影响。** **小李**每年花2000块买医疗保险。他被车撞的概率很低——但他买了。**这也不是因为悲观，而是万一真发生了后果太严重，值得提前花钱预防。** 同样的逻辑用在不同场景：小概率大损失 → 买保险；小概率大收益 → 买彩票（但别上瘾）。 **概率思维就是帮你分析\"这件事发生的概率多大 + 发生之后损失/收益多大 = 值不值得做\"。**", "concepts": ["### ① 概率不是猜测", "概率是有根据的估算。掷骰子得6点的概率是1/6——这是数学算出来的。但你不确定明天会不会考试——这个概率只能基于已知信息估计。", "### ② 期望值 = 概率 × 价值", "这是一个超级实用的公式：", "- 买彩票：0.01%×500万 = 500元（但成本5元 → 亏495）", "- 买保险：0.1%×赔偿50万 = 500元（保费800元 → 略贵但安心）", "- 考前复习多花1小时：假设提升及格概率从70%到90%，满分100→额外价值2分→值不值取决于分值权重", "### ③ 重要原则", "- **小概率≠不可能**：万分之一也可能轮到你", "- **大概率≠一定**：99%也还有1%翻车的可能", "- **长期来看**：坚持做期望值为正的事，短期波动会被平均掉", "### ⚡ 板书公式", "`决定一件事的值不值得做 = 它好的可能性 × 好的程度 vs 坏的可能性 × 坏的代价`"], "formula": ""}, {"id": 7, "title": "T07：逆向思维", "summary": "想成功？先想清楚怎么搞砸它，然后把那些事全避开。", "questions": "1. 如果你想让一个班级变糟糕，你会做什么？（认真想，这个练习很重要） 2. 你有没有过\"什么都没做错但就是没做好\"的经历？反过来想可能会帮你找到答案。", "story": "巴菲特说：\"我的成功只有一个秘诀——找出别人正在做什么让他们破产，然后千万别做那些事。\" 他不告诉你他是怎么选股的，但他明确告诉你哪些公司他绝对不碰：负债太高、业务看不懂、创始人品性有问题、行业在衰退……**他知道哪些是\"死路\"，这就够了。** 反向操作通常比正向找路容易得多——因为出问题比解决问题简单。", "concepts": ["### ① 正向思维 vs 逆向思维", "- **正向**：\"我要怎么做才能考好？\"→ 很难想到全部方法", "- **逆向**：\"什么事会导致我考不好？\"→ 很容易列出一大堆", "- 熬夜→第二天精神差→理解力下降", "- 考前焦虑→手抖→不会做的题也错了", "- 时间分配不合理→选择填空花太久→大题没时间", "### ② 为什么逆向更好用？", "因为人的大脑对负面信息更敏感。你一眼就能看到\"这个不行\"\"那个有问题\"。但看到\"这个很好\"反而需要更多分析。", "### ③ 两步法", "**先想失败清单**：列出所有可能导致失败的因素", "**反转成成功指南**：把每一项变成\"不要做这件事\"的行动", "### ⚡ 板书公式", "`成功 = 不做那些致命错误的事 × 做对关键的事`"], "formula": ""}, {"id": 8, "title": "T08：奥卡姆剃刀", "summary": "在没有更多信息的情况下，最简单的解释通常最接近真相——别给自己加戏。", "questions": "1. 你看到窗帘动了的第一反应是什么？是风吹的还是有人来了？ 2. 你有没有过\"越想越严重\"的经历——一件小事自己脑补成了一部灾难片？", "story": "一位医学教授对学生说：\"当你们听到蹄声时，应该想到马，而不是斑马。\" 意思是：**在没有特殊证据时，简单的解释通常比复杂的解释更好。** 如果你在学校走廊听到跑步的声音——大概率是同学跑过去了（马），不太可能是动物园逃出来的斑马穿过校园。（除非你在肯尼亚野生动物保护区附近上学。）", "concepts": ["### ① 简单 vs 复杂", "- **简单解释**：风开了窗户 / 他心情不好 / 老师没注意到我", "- **复杂解释**：外星人入侵了 / 他被控制了 / 老师故意针对我", "当两种解释都有可能但没有更多信息可以区分时，选那个需要更少假设的（简单的那个）。", "### ② 为什么我们总爱想复杂？", "因为我们的大脑喜欢编故事。一个模糊的信号会让大脑自动补全各种细节——这些细节大多是我们情绪投射的结果，不是事实。", "### ③ 怎么用？", "当你面临多种可能的解释时：", "列出所有可能的解释", "每种解释需要假设多少件事成立？", "**需要最少假设的那条 → 暂时相信它，直到有证据推翻**", "### ⚡ 板书公式", "`多个解释可选 → 数数哪个假设最少 → 没有额外证据前信简单的`"], "formula": ""}, {"id": 9, "title": "T09：汉隆剃刀", "summary": "能用\"疏忽/没注意到\"解释的事，就不要归因于\"他是故意的在针对我\"。减少不必要的生气。", "questions": "1. 你有没有过因为别人的一句话或一个动作而生气了好几天，后来发现根本不是那回事的经历？ 2. 你觉得你的好朋友\"故意不理你\"的可能性大还是\"他看到了忘记回\"的可能性大？", "story": "小红的笔借给了同桌小丽，第二天还回来的时候墨水少了一些。小红心里想：\"她肯定是故意的！她知道这支笔对我很重要！\" 但另一种可能：**小丽用的时候不小心手滑了，或者她的笔本来就是这样的。** 小红没有证据表明是故意的——所以她选择了最坏的解释。 如果小红直接去问：\"你的笔怎么弄到我的墨水了？\"——说不定答案完全出乎意料。 **这就是汉隆剃刀的力量：给别人的错误留一个善意的出口。**", "concepts": ["### ① 人类有个bug叫\"基本归因错误\"", "我们对别人的负面行为总喜欢往坏处想（\"他就是讨厌我\"\"他就是故意的\"），对自己的负面行为却总能找到好理由（\"今天太累了\"\"心情不好\"）。汉隆剃刀就是帮我们修正这个bug的工具。", "### ② \"愚蠢\"不是骂人", "这里的\"愚蠢\"指的就是**粗心、遗忘、信息不全、理解偏差**等非常常见的非恶意错误。每个人每天都在犯这种错。", "### ③ 为什么它有用？", "- **对自己**：减少人际关系中的摩擦和误会", "- **对别人**：让自己保持平和心态（不生气≠软弱）", "- **对社会**：很多冲突都是因为没有给对方\"留面子\"导致的升级", "### ⚡ 板书公式", "`别人做了让我生气的事 → 先假设他不是有心的 → 确认后再决定要不要在意`"], "formula": ""}, {"id": 10, "title": "T10：可证伪性", "summary": "一个说法如果不能被证明是错的——那它也没有提供任何有用的信息。学会问\"什么情况下这个说法会变成错的？\"", "questions": "1. \"星座说今天宜交友\"——这句话能被验证吗？如果能验证的话需要做些什么？ 2. \"喝热水对身体有益\"——怎么知道它是对的还是没用的？需要收集什么证据？", "story": "中世纪的人们一致认为\"所有天鹅都是白色的\"。这个说法听起来很合理——因为他们见过的天鹅确实都是白色的。 直到有人在澳大利亚发现了一只黑天鹅。 **一只黑天鹅就彻底推翻了\"所有天鹅都是白色的\"这个说法。** 这就是可证伪性的力量——一个好的理论必须能够被反例推翻。如果没有任何情况能推翻它，那它其实什么都没告诉我们。", "concepts": ["### ① 什么是可证伪性？", "一个说法如果是好的科学主张，就必须明确地说明\"在什么情况下它是错的\"。找不到这种情况的说法大概率是空话。", "### ② 怎么用？", "问自己或别人：\"什么样的结果会证明这个说法是错的？\"如果对方答不上来或者给出一个什么都解释的通的答案——警惕。", "### ③ 关键洞见", "- **不能证伪 = 不提供有用信息**（不是说一定是错的，只是目前不构成科学命题）", "- **很多骗局和伪科学的共同特征就是什么都解释得了**", "- **好的理论不怕被检验——因为它敢说出自己什么时候会错**", "### ⚡ 板书公式", "`一个说法 → 什么样的结果会让它变成错的？→ 找不到 → 不可证伪 → 没用 | 找得到 → 可检验 → 可能是真知的`"], "formula": ""}, {"id": 11, "title": "T11：必要×充分", "summary": "\"缺了它不行\"（必要条件）和\"有了它就够了\"（充分条件）是两回事——分清它们才不会搞错发力方向。", "questions": "1. \"有驾照\"是\"能开车\"的条件吗？是必要的还是充分的？ 2. \"满分\"是\"考上重点高中\"的必要条件还是充分条件？", "story": "小明有个同学对他说：\"你带了钥匙我就能给你开门。\"另一个同学说：\"你没钥匙就进不来。\"——同样是关于钥匙的话，一个是**\"有它就行\"**，一个是**\"没它不行\"**。 你觉得哪个对？**答案是：两个都对，只是说的方向不同！** 这就是区分\"必要\"和\"充分\"的重要性。很多人争论了半天其实是在说不同的东西。", "concepts": ["### ① 两种条件的区别", "- **必要条件 = 缺了绝对不行**（但不一定有它就行了）", "- 例：水是植物存活的必要条件（没有水会死），但有水不一定活（还需要阳光土壤等）", "- **充分条件 = 有了就足够**（但不一定非要有它）", "- 例：满分为考上重点高中的充分条件（拿了肯定上），但不是必要条件（不拿也可以上）", "### ② 怎么判断？", "问自己两个问题：", "- **如果A不存在B还会发生吗？** → 不会→A是必要的；会→A不是必要的", "- **如果A存在B一定会发生吗？** → 会→A是充分的；不一定→A不是充分的", "### ③ 关键洞见", "大多数问题都同时有必要的和充分的条件，分清它们才能找到真正的发力点。比如你想提高成绩：考试及格是必要条件但不是充分条件（还要考虑排名、竞赛等因素）。", "### ⚡ 板书公式", "`必须有 ❌ 不一定够 → 必要条件 | 够了 ✅ 不一定必须 → 充分条件`"], "formula": ""}, {"id": 12, "title": "T12：因果vs相关", "summary": "两件同时发生的事不一定是因果关系！经常有人把\"碰巧一起出现\"当成\"谁导致谁\"。", "questions": "1. 研究发现\"吃早餐的学生成绩更好\"——是因为吃早餐让人变聪明吗？ 2. \"我穿了幸运内衣所以考试考好了\"——这个有关系吗？有因果关系吗？", "story": "有一个真实的数据统计：冰淇淋销量最高的月份，游泳池溺亡事件也最多。 **结论：吃冰淇淋会导致溺水？**（当然不是。） 真正的解释是：**天气热。** 天热→大家买冰淇淋 + 下游泳 → 两个数据同步增长。它们之间没有任何因果关系，只是因为第三个因素（天气）同时影响了它们。 这就是\"相关≠因果\"最经典的陷阱。", "concepts": ["### ① 什么是相关？", "A发生时B也经常发生。比如\"下雨天和带伞次数成正相关\"——但它们之间没有因果关系，都源于\"天气预报说会下雨\"。", "### ② 什么是因果？", "A发生了所以B才发生。吃了药→体温下降。这是真正的因果链条。", "### ③ 怎么区分？", "看**控制变量法**：如果A变了但B不变，说明A不导致B。或者找一个\"第三因素C\"看看是不是它在背后同时影响A和B。", "### ⚡ 板书公式", "`A↑ B↑ → ≠ A→B → 找第三因素C | A→B需要排除所有其他可能解释`"], "formula": ""}, {"id": 13, "title": "T13：相对性", "summary": "很多\"事实\"其实是相对的——没有绝对的标准答案，只有\"跟谁比\"\"在什么情况下\"。", "questions": "1. 你觉得\"我很聪明\"这句话是对的还是错的？ 2. 北京今天气温30度你觉得热，哈尔滨今天也是30度你觉得刚好——为什么？", "story": "桌上有三盆水：左边很烫、中间温度合适、右边很凉。小明先把左手放进热水、右手放进冷水，坚持30秒。然后同时把两只手都放进中间那盆温水——奇怪！他的左手觉得这水\"好凉\"，右手却觉得\"好热\"。 **同一盆水，为什么感觉不同？** 因为你的感受是相对于你之前的状态而言的。你的手就是\"参照系\"。", "concepts": ["### ① 判断都是相对的", "- \"高矮快慢好坏\"——都需要一个比较对象才有意义", "- 你在全校可能是前10%，但在全国可能就是后50%", "- **同一个东西在不同参照系下可以是完全相反的结论**", "### ② 关键洞见", "当你觉得自己\"特别好\"或\"特别差\"时，问问自己：\"相比什么呢？\"换个参照系，结论可能完全反转。", "### ③ 但也不是所有事都是相对的", "数学题的答案是绝对的（2+2=4），法律的规定也是绝对的。重要的是知道哪些领域可以用相对思维分析，哪些不行。", "### ⚡ 板书公式", "`A好不好 → 必须问：跟B比吗？在C条件下吗？ | 同一件事不同参照 = 不同结论`"], "formula": ""}, {"id": 14, "title": "T14：相互作用", "summary": "你对我做了什么，我也对你做什么——人际关系就像回声山谷，你永远听到自己声音的反射。", "questions": "1. 如果你对同学微笑，他通常怎么回应？如果对他翻白眼呢？ 2. 你和老师的关系是怎样的？你的态度会影响他教你的方式吗？", "story": "小明站在山谷前大喊\"你好\"，听到的是\"你好\"；他又喊\"讨厌\"，听到的是\"讨厌\"。 山没有思想，但它忠实地把声音反射回来。**人际关系也是一样——你对别人好的方式，决定了别人对你的方式。** 但这不是简单的\"好人为好人\"。因为人的反应有延迟——你今天对他好，他可能过几天才回馈你；你今天惹了他，他也可能等到下次机会再反击。", "concepts": ["### ① 牛顿第三定律在人际关系中的应用", "每个作用力都有一个大小相等、方向相反的反作用力。", "- 你尊重别人 → 别人更可能尊重你", "- 你信任别人 → 别人更愿意信任你", "- 你帮助他人 → 他人更愿意帮助你", "### ② 关键洞见", "很多时候你觉得\"对方为什么这样对我\"——其实是在回答你自己之前的问题。改变你的行为，对方的回应也会变。", "### ③ 但也不是所有关系都是即时反馈", "有些关系有延迟（比如师生关系），有些关系不对称（长辈对晚辈和晚辈对长辈），还有一些关系甚至不存在双向互动（比如人和宠物的关系）。", "### ⚡ 板书公式", "`你的行为A → 对方的反应B → B又成为你新的输入 → 循环/螺旋`"], "formula": ""}, {"id": 15, "title": "T15：热力学熵增", "summary": "不投入就会变糟——这不是悲观，这是物理定律。知道这一点你就不会放弃\"维持现状\"的努力。", "questions": "1. 你的书桌/房间是从什么时候开始变乱的？是你主动弄乱的还是\"不知不觉就乱了\"？ 2. 你小学学过的内容还记得多少？如果每天不复习的话，知识会自己记住吗？", "story": "你刚买的手机用一年就慢了，两年就更明显了。**你也没有故意搞坏它**，它就是一天天变卡的。 这是为什么？因为你的手机操作系统需要越来越多资源来运行同样的功能——新装的应用、缓存垃圾、碎片文件都在增加。这就是熵增在数字世界里的表现：**没有维护的系统永远趋向于退化。** 人也是一样的。知识不用就忘，技能不生疏就废，身体不运动就弱——不是因为你做错了什么，而是因为\"不做事\"本身就是退步。", "concepts": ["### ① 宇宙的基本规律", "万物天然趋向混乱。房子会老、食物会变质、友谊会变淡。**好的状态不会自动保持**——你需要持续投入能量来维持它。", "### ② 两个关键洞见", "\"什么都不做\" = \"在退步\"。这不是鸡汤，是物理学。", "一旦过了某个临界点就无法逆转（牙齿松了不会自己长回来）。所以预防优于治疗。", "### ③ 对抗熵增的策略", "- **日常维护**：每天花少量时间防止退化（如每日背单词）", "- **定期大修**：每周/月做一次深度整理和复盘", "- **提前预防**：在问题出现之前就处理掉", "### ⚡ 板书公式", "`不投入 → 自然衰退 → 要想保持 → 必须持续投入 | 过了临界点 → 不可逆`"], "formula": ""}, {"id": 16, "title": "T16：惯性", "summary": "改变一个旧习惯很难——不是因为懒，而是因为真的有物理原理在起作用（和牛顿第一定律一模一样）。", "questions": "1. 你有没有过\"本来计划了要做的事但因为太舒服就不动了\"的经历？ 2. 为什么很多人年初发誓新年目标然后三月就放弃了？你觉得原因是什么？", "story": "坐在行驶中的公交车上，司机突然踩了一脚急刹车——你的身体会怎样？（向前冲。） 这就是**牛顿第一定律：物体保持原来的运动状态**。你身体想继续保持\"向前走\"的状态，即使车已经停了。**人的行为习惯也一样——它也会\"向前冲\"。** 改变一个坏习惯就像让一辆高速行驶的汽车停下来——需要很大的力量、很长的距离。但一旦习惯了新行为，它就变成了新的\"自然状态\"，反而容易维持。", "concepts": ["### ① 惯性的两面", "- **从旧到好的惯性**：最难的是第一步（启动需要最多力气）", "- **从好到坏的惯性**：一旦养成了习惯就很难戒掉（刹车也需要很多力气）", "### ② 关键洞见", "- **最大的阻力来自第一阶段**——打破原有惯性比持续维持更需要力量", "- 但反过来：**一旦习惯了某种行为它就自动运转了**，这时候其实省力了", "### ③ 怎么克服自身惯性？", "- **降低启动门槛**：从最小可能的量开始（比如从每天跑1分钟开始而不是5公里）", "- **固定时间和地点**：把行为绑定到一个已有的日常习惯上", "- **给自己一个\"开始信号\"**：比如设定一个闹钟或做一个特定的动作", "### ⚡ 板书公式", "`改变 → 最困难(最大阻力) → 形成新习惯 → 自动维持(省力)`"], "formula": ""}, {"id": 17, "title": "T17：杠杆", "summary": "找到那个\"花小力气就能撬动大结果\"的点，比在所有地方平均用力好一百倍。", "questions": "1. 你觉得你做的所有学习和生活事情里，哪几件对你长期目标的影响最大？ 2. 如果只有1小时可用来提升数学——你会选择做什么？", "story": "小明有两个选择：今天花一小时跑步或花一小时背单词。跑步让他感觉良好但第二天又忘了；背单词虽然痛苦但积累起来词汇量在增长。 **哪个是更大的\"力臂\"？** 背单词。因为它会产生累积效果（学过的单词不会消失），而跑步的效果是一次性的。找对方向比努力更重要——这就是杠杆思维。 但在现实中，杠杆点不是一眼就能看出来的。你需要分析每个行动的**投入产出比**。", "concepts": ["### ① 什么是杠杆？", "阿基米德说：\"给我一个支点，我就能撬动地球。\"不是因为他力气大，而是因为他找到了一个能让小力产生大效果的位置。", "**学习上：** 错题本 > 盲目刷题。因为从错误中学习效率最高——这是你的\"力臂最长的点\"。", "### ② 关键洞见", "- **不是所有地方都值得同等用力**——找到那个杠杆效应最强的区域集中火力", "- **如果找不到好的支点，力气再大也没用**——先想清楚再做", "- **短期看可能\"不够努力\"的事，长期回报远超\"看起来很努力\"**", "### ③ 三步法", "**列出你能做的事**", "**估算每项的预期回报**（分值提升、技能提升等）", "**把最多的时间投给回报率最高的那一两个事**", "### ⚡ 板书公式", "`效果 = 力 × 力臂 → 与其增加力气不如加长力臂`"], "formula": ""}, {"id": 18, "title": "T18：自然选择", "summary": "不是最强的能活下来，而是最能适应环境变化的才能留下来。", "questions": "1. 你觉得你们班里有哪些\"人设\"？（学霸型、社交达人型、运动型、安静型...）这些类型是怎么形成的？ 2. 诺基亚曾经是手机之王为什么会倒下？苹果赢了是因为它比诺基亚更强大吗？", "story": "6500万年前恐龙统治地球——它们又大又强。然后一颗小行星撞了地球，气候大变，食物链崩溃。恐龙灭绝了。 但当时还有很小很小的哺乳动物活下来了。**不是因为它们更强壮，而是因为**： - 它们体型小，需要的食物少 - 它们能躲在地洞里 - 它们能适应各种食物来源 **环境一变，原来的强者可能瞬间变弱者。谁能活下来取决于谁能最快适应新环境。**", "concepts": ["### ① 自然选择的三个要素", "**多样性**：有各种各样的类型/方案/策略", "**筛选**：环境选出适合的那一种", "**遗传**：适者繁殖或推广，不适者被淘汰", "这个过程在自然界中花了千万年，在社会中可以只花几年甚至几天。", "### ② 关键洞见", "- **适应 > 强大**：能在变化中存活下来的通常不是最强大的那个，而是最灵活的那个", "- **昨天的冠军不等于今天的冠军**：当规则变了的时候一切重新洗牌", "### ③ 对学生有什么用？", "你的考试制度、班级文化、社会趋势都在不断变化。你要学会的不是\"做到最强\"而是\"**适应力最强**\"。", "### ⚡ 板书公式", "`环境变 → 适应能力强的生存 → 不适应的被淘汰 → 持续变化需要持续适应`"], "formula": ""}, {"id": 19, "title": "T19：红皇后效应", "summary": "不停跑才能留在原地——当所有人都卷起来的时候，不进步就是在退步。", "questions": "1. 你有没有觉得\"明明已经很努力了但还是感觉没进步\"？为什么？ 2. 你觉得如果全班同学都在周末补课——每个人的相对排名会怎样变化？", "story": "想象两个人在跑步机上跑步。第一个人跑得很快，第二个人也拼命追。但两个人的位置都没有变——因为**跑步机也在加速**。 这就是红皇后效应：在一个不断加速的竞争环境中，你必须持续进步才能保持现有地位。不是你不够好，是别人也在变好。 爱丽丝问红皇后：\"我跑得多快才会到那里？\"红皇后说：\"你得跑得比现在快两倍才能到那儿！\"", "concepts": ["### ① 红皇后效应的本质", "- **个体层面**：你进步的速度必须至少等于环境变化的速度", "- **系统层面**：所有人都加速了 → 没有人的相对位置改变 → 但每个人都更累了", "### ② 关键洞见", "- 当整个系统都在加速时，静止就是后退", "- 有时候你需要跑得超过\"看起来需要的\"——因为你不知道别人会加速多少", "- 但最重要的是：**不要盲目地加速，要知道往哪个方向跑**", "### ③ 怎么应对？", "- **选对赛道**：找一个竞争没那么激烈但你擅长的领域", "- **提高效率**：同样时间产出更多（杠杆思维）", "- **适度退出**：不是每个赛场都要参加，学会战略性放弃", "### ⚡ 板书公式", "`所有人都在加速 → 你的相对位置不变(除非你超速) | 停不下来是因为停下来就落后`"], "formula": ""}, {"id": 20, "title": "T20：合作共生", "summary": "互相帮忙可以让每个人都变得更好——不是\"牺牲自己成全别人\"，而是找到双赢的方案。", "questions": "1. 你有没有过一个朋友在某个方面很强、你在另一个方面很强——你们互相帮忙后两个人都变好了？ 2. 你觉得小组合作的时候，什么情况下大家真的能学好？什么情况下其实是\"有一个人全包了\"？", "story": "海里有一种叫小丑鱼的鱼，身上有层粘液可以不被海葵蜇伤。它住在海葵旁边：海葵保护它不被大鱼吃掉，它的排泄物给海葵提供养分。 **两种不同的生物互相需要，谁也离不开谁。** 这就是自然界中最经典的合作共生案例。 人类社会也一样——你帮别人补数学，他帮你练英语口语。你不需要什么都擅长，但你需要和别人合作来弥补自己的不足。", "concepts": ["### ① 共生 vs 竞争", "- **竞争**中\"A赢就是B输\"（零和博弈）", "- **共生**中\"A好了B也好\"（正和博弈）", "大多数时候生活中既有竞争也有合作。聪明的做法是知道什么时候该合作、什么时候该竞争。", "### ② 好的合作不是牺牲自己去成全别人", "关键是要找到各自都能获益的方式。如果一方一直在付出而另一方一直在索取，这不叫共生——这叫剥削。", "### ③ 怎么设计一个共赢的合作方案？", "列出每个人的优势", "找出互补的需求", "设计一个双方都有明确收益的规则", "定期评估公平性", "### ⚡ 板书公式", "`找到各自的长处 → 交换互补需求 → 双方都获益 → 关系稳固且长期`"], "formula": ""}, {"id": 21, "title": "T21：激励设计", "summary": "你想什么行为多出现，就奖励什么行为——对自己对别人都适用。", "questions": "1. 你什么时候最有动力去做一件事？是因为有人夸你、有奖品拿，还是其他原因？ 2. 你有没有发现\"老师越关注谁，谁的举动越多（不管是好还是坏）\"？", "story": "小明爸爸妈妈想让他自觉做家务。一开始说了很多次但效果不好。后来他们想了个办法：每做完一次家务贴一张贴纸，攒够5张贴纸可以换一顿他最爱吃的披萨。 **第一个星期**小明积极性爆棚。 **第二个星期**开始下降——因为披萨不是每天都有的。 **第三个月**虽然贴纸不香了，但做家务变成了习惯。 **关键问题是**：父母在第三个月后应该做什么？答案是：**把外在激励变成内在激励**——不再给披萨，但每次小明主动做完后说\"做得很好，房间变干净了你住得也舒服\"。", "concepts": ["### ① 好的激励机制", "你想要什么行为 → 就奖励什么行为。**不要意外地惩罚你想要的东西。**", "- 表扬努力学习 → 学生会更愿意努力", "- 批评问问题 → 学生不敢问了", "### ② 坏的激励机制", "表面目的是A，实际激励出来的是B：", "- \"作业全做对有奖品\"→ 学生只求快不求好", "- \"举报同学违纪加分\"→ 互相猜忌而非真正改进", "### ③ 对自己的激励设计", "既然知道了外部世界常常激励错方向——你也可以反过来**给自己设计一个好的激励机制**来控制自己的行为：", "```markdown", "我想养成的习惯：_____________", "【奖励机制】：做了一次→__________", "坚持一周→__________", "坚持一个月→__________", "【惩罚机制】：连续三天没做→__________（温和一点！别太狠）", "```", "### ⚡ 板书公式", "`想要什么行为 → 奖励它 → 避免无意惩罚你想要的行为 → 逐步内化为自觉`"], "formula": ""}, {"id": 22, "title": "T22：最省力原则", "summary": "人天生倾向于选择最简单省力的方式——理解这一点你就能更好地管理自己的时间和行为。", "questions": "1. 你有没有过\"本来想好好学习但拿起手机就停不下来\"的经历？这算不算最省力原则在起作用？ 2. 你做作业的时候，是先做简单的还是先做难的？为什么？", "story": "一只蚂蚁找到了一粒比它大十倍的饼干屑。按道理它可以慢慢搬运。但它发现了一条更近的小路——然后叫来几只同伴一起走那条最近的路。 **如果绕远路需要5分钟抄近路只要2分钟——省下的时间可以去搬更多食物。** 人类也一样。我们的大脑会无意识地寻找消耗最少能量的路径来完成一个任务。这不是缺点——这是进化的结果。", "concepts": ["### ① 物理世界的惯性", "水往低处流、球滚下斜坡——自然界中所有系统都趋向最低能量状态。", "### ② 行为层面的表现", "- 我们会选择最简单的路线回家（即使不是最快的）", "- 写作业时先做不用动脑子的科目", "- 背课文时用朗朗上口的口诀而不是死记硬背", "### ③ 关键洞见", "- **大多数时候\"省力\"是好事**——效率的核心就是用最少投入获得最大产出", "- **但如果方向错了越省力就离目标越远**——比如刷短视频虽然省力但对学习的目标是背道而驰的", "### ⚡ 板书公式", "`目标确定后 → 选阻力最小的路径 | 方向错了 → 越省力越快偏离目标`"], "formula": ""}, {"id": 23, "title": "T23：反馈回路", "summary": "一件事的结果会反过来影响它本身——好事越做越多，坏事也停不下来。", "questions": "1. 你记过单词之后第二天复习了一遍记住了→又有了成就感→更想接着背——这算一种\"循环\"吗？ 2. 有没有什么事你觉得\"一旦开始就停不下来了\"？（比如打游戏、刷短视频）", "story": "把麦克风和音箱靠太近了会发生什么——你会听到刺耳的尖叫声！过程是这样的： 1. 你对着麦克风说了一句话 2. 音箱把声音放大了 3. 麦克风又收到了这个放大的声音再放大一次 4. 更大的声音又从音箱出来 5. 重复步骤3和4... **这就是一个正反馈循环：A→B→更强的A→更强的B→停不下来。** 好消息是：有些正反馈是好的（好习惯滚雪球），坏的是坏的（坏习惯越陷越深）。识别你是哪一种很重要。", "concepts": ["### ① 两种反馈回路", "- **正反馈（增强）**：越来...越多/越快/越强 → 雪球效应", "- 好的：学得好→被表扬→更爱学→成绩更好", "- 坏的：熬夜→上课困→听不懂→作业不会→更焦虑→更难睡", "- **负反馈（调节）**：自动回稳 → 恒温器机制", "- 例：体温高了→出汗降温；体温低了→发抖产热", "### ② 关键洞见", "- **大多数长期习惯都是通过正反馈形成的**——要么变好要么变坏", "- **\"停不下来\"的东西几乎都有正反馈在推波助澜**", "- **打破恶性循环的关键是切断链条中的一个环节**", "### ③ 怎么利用它？", "- 想要好习惯？**设计一个从第一步就能启动的正反馈**（比如每天学5分钟就有成就感）", "- 想要戒掉坏习惯？**制造一个\"暂停信号\"**（比如规定自己玩20分钟必须停下来想一想）", "### ⚡ 板书公式", "`行为→结果→结果影响下一次的行為 → (正反馈:越来越强) | (负反馈:自动回调)`"], "formula": ""}, {"id": 24, "title": "T24：瓶颈", "summary": "你的总成绩取决于你最弱的那一科（或最薄弱的环节）。找到它，解决它，比在强项上再多花10倍功夫有效。", "questions": "1. 你觉得你目前最大的\"短板\"是什么？哪门课或者哪项技能拖了后腿？ 2. 你有没有发现某个小问题一直卡着你进步但你一直没去解决？", "story": "一个木桶能装多少水，不由最长的板决定，而由**最短的那块板**。不管其他板有多长，水总是从最短那块板的高度溢出来。 后来有人问了个问题：\"如果我把最短的板加长到和其他一样长会怎样？\"答案是：能多装好多水！ **但如果这个桶有七块板呢？** 你把最短的加长了之后，第二短的那个就成了新的最短的——也就是新的\"瓶颈\"。所以要持续找并解决瓶颈。", "concepts": ["### ① 瓶颈在哪，效率就在哪被限制", "- 数学70分、英语90分、语文85分 → 提升数学从70到85对总分贡献最大", "- 每天只写30分钟作业但写了两个小时 → **效率瓶颈是注意力/方法**，不是时间", "### ② 为什么找瓶颈难？", "因为人们倾向于在自己擅长的领域努力（做得好有成就感），而回避自己弱的地方（做不好很挫败）。聪明的人能克服这种本能。", "### ③ 三步法", "**识别**：找出限制你当前水平的最关键因素", "**投入**：把额外的时间和精力优先投给瓶颈", "**更新**：解决了一个瓶颈后，马上找下一个", "### ⚡ 板书公式", "`总水平 = 最短的那个短板 → 补短板 > 加强长板 → 一个一个补`"], "formula": ""}, {"id": 25, "title": "T25：安全边际", "summary": "给自己留余地——不是因为你一定会翻车，而是因为世界充满不确定性。", "questions": "1. 你考试复习的时候，是\"刚好复习到考纲要求的水平\"还是\"多准备了20%\"？ 2. 出门赶火车/飞机，你是卡着点到还是提前多久到？为什么？", "story": "工程师设计了一座大桥。根据计算，桥最多能承重100吨。但他只允许80吨的车上桥。 有人问：\"那100吨不是能用吗？为什么要浪费20吨的容量？\" 工程师回答：\"因为我要考虑很多不确定因素——桥梁老化、超载车辆、地震风载、材料疲劳……**预留的这20吨不是浪费，是保险。**\" 考试也是一样的。你说你能考80分——那你准备到85-90分的水平会更有把握。多准备的这部分就是安全边际。", "concepts": ["### ① 什么是安全边际", "在\"刚好够用\"的基础上额外多做一些。**它不是说你不自信——恰恰相反，它说明你很理性地评估了风险和不确定性。**", "### ② 什么时候最需要安全边际？", "- **重要的事**（中考、高考）→ 大的安全边际", "- **不确定的事**（天气预报不准的天气出门）→ 中等安全边际", "- **小事**（今天中午吃什么）→ 不需要安全边际", "### ③ 关键洞见", "离目标越近、容错空间越小，就越需要安全边际。如果你只比及格线高一分，任何一个小小的失误就可能挂科——所以你要保证自己有足够多的分数余量。", "### ⚡ 板书公式", "`设定一个比目标更高的标准 → 留出犯错的空间 → 即使出点意外也能达标`"], "formula": ""}, {"id": 26, "title": "T26：临界质量", "summary": "量变积累到一定程度才会质变——在达到那个点之前看起来什么都没发生，但其实都在蓄力。", "questions": "1. 你有没有坚持做一件事很久却看不到效果然后差点放弃的经历？ 2. 背了50个单词好像没什么感觉，但有一天突然发现\"咦我能看懂一段简单的英文了\"——这个转变是怎么发生的？", "story": "你在一壶水里加热。0°C → 10°C → ...→ 90°C → 99°C——都是液态，看不出任何变化。到了**100°C的瞬间**，整壶水同时开始沸腾！ 为什么不是从99°C就开始沸腾？因为水分子需要积累足够的能量才能集体突破\"液态束缚\"。**100°C就是临界点（相变点）。** 在这之前所有的热量都在\"浪费\"地升温——但它们没有白费，是到达临界点的必经之路。 学习也一样：前几个月你可能觉得\"学了跟没学一样\"——别急，你可能正在接近自己的临界点。", "concepts": ["### ① 三个阶段的真相", "- **缓慢积累期**：每天都在进步但看不出来（最考验耐心）", "- **临界点**：突然有一天发现\"我怎么变得这么厉害了？\"", "- **爆发增长期**：进步速度肉眼可见地加快", "### ② 最大的敌人：在临界点之前放弃", "大部分人死在了第一阶段。不是因为方法不对、不是因为不努力——只是没有熬过\"看不见效果\"的阶段。", "### ③ 每个人和每个领域的临界点不同", "背1000个英语单词可能是一个人的临界点；弹一首钢琴曲可能需要练500小时。关键是搞清楚你在做什么领域、大概需要多少积累。", "### ⚡ 板书公式", "`坚持 → 看不到效果是正常的(在临界点之前) → 别停 → 过了临界点后一切都不一样`"], "formula": ""}, {"id": 27, "title": "T27：复利效应", "summary": "每天进步一点点，长期积累会产生巨大的变化。刚开始很慢但后来会越来越快。", "questions": "1. 你觉得坚持每天背5个单词和一次性背30个单词——哪种效果持久？ 2. 你有没有过\"努力了很长时间好像没变化\"然后突然有一天发现自己\"变强了\"的经历？", "story": "一张A4纸厚度约0.1毫米。把它对折一次变成0.2毫米，两次0.4毫米……每次都翻倍。 **需要折多少次才能达到地月距离（38万公里）？** 你以为至少100次吧？其实只需要 **42次**。 第一次到第十次：几乎看不出变化（从0.1mm到0.5cm）。 第二十次：大约1米厚——你还是觉得不怎么样。 第三十次：1公里——开始有点意思了。 第四十二次：38万公里——到了月球！ **前面的39次看起来都白费了——其实它们在积蓄势能。** 这就是复利的力量。", "concepts": ["### ① 两个关键参数", "- **增长率**：你每次进步多少（每天学5个 vs 每天学10个）", "- **持续时间**：你坚持了多少次（一个月 vs 一年）", "**两者缺一不可。** 增长率高但时间短 = 没什么用；时间长但增长低 = 也很慢。最好的组合是中等以上的增长+足够长的时间。", "### ② 早期很挫败是正常的", "复利曲线在前期几乎是平的——因为指数增长的特点就是起步慢、后期爆发。很多人死在了\"看不到效果\"的阶段，以为自己的努力没用。其实不是没用，只是还没到拐点。", "### ③ 坏习惯也有复利效应", "每天熬夜→身体越来越差。每天偷懒→成绩越来越下滑。复利不仅帮你变好，也会让你变糟。所以关键是选择好的方向然后坚持。", "### ⚡ 板书公式", "`小步快跑 + 长期坚持 → 爆发式增长 | 中途放弃 → 前功尽弃`"], "formula": ""}, {"id": 28, "title": "T28：帕累托原则（80/20法则）", "summary": "你只需要把精力花在最重要的那20%上——它们会给你80%的结果。", "questions": "1. 你的书包里有多少东西是你一个月都没碰过的？ 2. 考试的时候，你觉得哪些题型占了最大分值？那些是不是你平时花最多时间练习的？", "story": "小明打开衣柜发现一件事：他穿了大概20%的衣服，占了他衣柜空间的80%。其他80%的衣服——那些\"也许以后穿得上\"\"打折买的很便宜\"\"颜色挺好看的\"——一次都没穿过。 后来他做了一件事：把常穿的几件放在最容易拿到的地方，其他的收了或送了。**结果就是每天早上选衣服的时间从5分钟变成30秒。** 同样的道理可以用在学习上。", "concepts": ["### ① 80/20不是精确数字", "不是说一定是80和20。它揭示了一个普遍规律：**在大多数情况下，少数因素起了主要作用**。可能是70/30、60/40、90/10——但模式是一样的。", "### ② 学习上最常见的例子", "- **20%的知识点** → 占了试卷 **80%的分数**（比如数学的大题通常分值很高）", "- **20%的错题类型** → 导致了你 **80%的失分**", "- **20%的做题方法** → 帮你解决了 **80%的题目**", "找到这关键的20%，你的效率能翻倍。", "### ③ 反向应用也很强大", "把花在低价值事情上的精力转移到高价值的事情上，而不是增加总学习时间。", "### ⚡ 板书公式", "`找出高回报的20% → 集中火力于此 → 减少低效投入 → 同等时间更大产出`"], "formula": ""}, {"id": 29, "title": "T29：均值回归", "summary": "极端表现（特别好或特别差）之后通常会回到正常水平——这不是\"运气守恒定律\"，而是统计规律。", "questions": "1. 你上次考得特别好是什么时候？下一次考得怎么样了？ 2. 你考砸过一次后有没有觉得\"我是不是变笨了\"？还是后来恢复正常了？", "story": "NBA有个很有趣的现象：某位球星在某场比赛得了50分（远超平常水平），第二场几乎没人会再得那么高了。不是因为他的技术下降了——而是因为50分那天他超常发挥，概率上不可能每次都有50分的表现。 媒体喜欢给这种波动起名字：\"手感火热\"\"状态下滑\"——但数据告诉我们：**这只是统计学上的均值回归。** 极端值不会持续，迟早会回到平均水平附近。 考试也是这样。你这次考了全班第一不代表你会一直第一；这次倒数第一也不代表你笨透了。", "concepts": ["### ① 什么是均值回归", "极端的好结果或坏结果之后，下一次的结果通常会更接近平均。不是说因为你有好结果下次就一定会被惩罚——而是因为极端情况本身就很少见。", "### ② 两个重要提醒", "- **好消息**：考试很差别绝望——大部分情况下下次会更好（不需要突然变努力）", "- **别飘**：考得太好也别太得意——大概率下次没那么高", "### ③ 不是所有波动都是均值回归", "如果成绩从60变成90然后一直保持90——那不叫均值回归，那叫你真的进步了。均值回归说的是那些没有实质性改变的波动。", "### ⚡ 板书公式", "`异常高 → 下次更接近平均 | 异常低 → 下次更接近平均 | 持续改变 → 那是真的进步`"], "formula": ""}, {"id": 30, "title": "T30：乘以零", "summary": "任何一个关键因素为零，其他再好也白搭。先找到那个\"不能没有\"的东西，再管别的。", "questions": "1. 如果考试时发现忘带准考证/文具了——前面的复习再多有没有用？ 2. 一个团队有10个人每个都很强但其中一个人完全不配合——这个团队能做好吗？", "story": "一列火车有10节车厢装满了货物，每节约值85万——总价值约850万。但第6节车厢是空的（因为没装货）。 **总价值是多少？** 如果把这当作乘法链的话：85×70×90×100×**0**×60 = **0**。 现实中也一样：一个方案再好、计划再完美、执行再出色——但如果基础法律合规出了问题（被查封），一切归零。", "concepts": ["### ① 什么是\"零乘数\"？", "就是你的成功公式中任何一个为负或为零的因素。不是所有环节都要满分——但如果有**一票否决**的因素，你就得特别小心。", "### ② 生活中的常见零乘数", "- 考试：**诚信**（作弊直接零分+处分）", "- 健康：**生命安全**（出大事了一切都没了）", "- 友谊：**信任**（背叛一次可能永远失去）", "- 比赛：**到场**（不参加就等于零）", "### ③ 怎么用？", "在做任何重要事情之前问自己：\"**有没有什么事一旦发生就会让这一切全部白费？把它排除掉。**\"", "### ⚡ 板书公式", "`成功 = A × B × C × ... × N → 任何一项=0 → 整体=0 | 找出那项 → 确保它不为0`"], "formula": ""}, {"id": 31, "title": "T31：随机性", "summary": "有些结果只是运气——区分\"实力\"和\"运气\"能帮你更客观地看待自己的成败。", "questions": "1. 你上次考试考得特别好——有多少是因为你真的懂了？有多少是刚好复习到了？ 2. \"我每天背单词所以英语水平提高了\"——这里面有多少是坚持的力量、多少只是时间推移的自然进步？", "story": "小明连续5次掷骰子都是6。朋友们都惊叹：\"他今天手气太好了！\"然后第6次还是6，第7次... **但数学上，每次掷出6的概率永远是1/6——即使连续出现7次也不改变下一次的结果。** 很多人会犯一个错误：觉得\"已经出了7次6下次不太可能是6了\"（赌徒谬误），或者觉得\"他现在太红了不能再买了\"——其实每次投掷都是独立事件，和之前没有任何关系。", "concepts": ["### ① 实力和运气的比例", "几乎所有结果都同时受实力和运气影响：", "- **中考/高考**：约70%实力 + 30%运气（恰好没遇到自己最弱的知识点）", "- **彩票**：0%实力 + 100%运气", "- **长期学习成绩**：90%+ 实力（长期来看运气会被平均掉）", "### ② 关键洞见", "**好的决策不一定有好的结果**——可能只是运气差", "**坏的决定也不一定导致坏结果**——可能只是运气好", "**样本量越大，运气的影响越小**——多做几次就能看出真正的实力水平", "### ③ 怎么用？", "- 成功了要分析有多少运气成分——避免骄傲", "- 失败了要看清楚有多少是随机波动——避免过度自责", "### ⚡ 板书公式", "`单次结果 = 实力(大部分) + 运气(小部分) | 多次平均 ≈ 实力(运气被抵消)`"], "formula": ""}, {"id": 32, "title": "T32：复杂适应系统", "summary": "很多系统由许多小个体组成，每个都在\"学\"和\"调整\"——整体行为无法简单预测，简单的规则能产生复杂的效果。", "questions": "1. 你觉得班级氛围是老师制定的还是同学们一起形成的？如果是后者，它是怎么\"自发形成\"的？ 2. 网上热搜是怎么产生的？几个人的讨论怎么变成几百万人关注的？", "story": "你抬头看天上成群飞鸟——它们没有指挥官、没有信号旗，但能同时转向、散开、聚合。 每只鸟只需要遵循三个简单规则： ① 不要撞到邻居 ② 朝同伴的平均方向飞 ③ 靠近但不太近 **这三条简单的规则产生了壮观的整体效果。** 这就是复杂适应系统的魔力。 人类社会中到处都是这样的系统：社交网络上的观点传播、金融市场中的价格波动、甚至你们班的学习氛围。", "concepts": ["### ① 什么是复杂适应系统？", "由许多能够学习和适应环境的个体组成的系统。整体行为不是任何单个个体决定的——而是所有个体相互作用的结果。", "### ② 关键特征", "- **涌现**：整体表现出个体不具备的特性（一个同学认真不代表全班都认真）", "- **不可简单预测**：虽然每个个体的行为可能很简单，但整体结果很难准确预测", "- **自组织**：不需要中央控制也能形成有序结构", "### ③ 怎么用？", "在设计或改变一个系统时，不要试图直接控制结果——而是**设计好个体之间的互动规则和初始条件**，让好的结果自然涌现。", "### ⚡ 板书公式", "`个体(简单规则) + 互动 → 涌现(意想不到的全局模式)`"], "formula": ""}, {"id": 33, "title": "T33：混沌动力学", "summary": "小事可能引发巨大的连锁反应——在复杂世界里，有些微小的初始差异会导致完全不一样的结果。", "questions": "1. 你有没有过\"因为一个小失误导致意想不到的大后果\"的经历？比如迟到导致连锁反应？ 2. \"我选错了答题卡位置→这道大题全扣分→总分排名下降→志愿填报受影响\"——这算不算蝴蝶效应？", "story": "气象学家洛伦兹提出过一个著名的假说：**一只蝴蝶在巴西轻轻扇一下翅膀，几周后可能在美国得克萨斯引起一场龙卷风。** 不是真的有直接因果关系链条——而是因为大气系统对初始条件极其敏感。一个微小的扰动通过层层放大最终产生完全不同的天气。 **天气预报为什么超过两周就不准了？** 不是因为技术不够好，而是因为系统的敏感性决定了长期预测本质上是不可行的。", "concepts": ["### ① 什么是混沌系统？", "由确定规则驱动但长期行为无法准确预测的系统。简单规则+非线性相互作用 = 看似随机的结果。", "### ② 关键特征", "- **短期可预测**（明天大概率出太阳）", "- **长期不可预测**（三个月后的精确气温算不出来）", "- **初始条件的微小差异被指数级放大**", "### ③ 对学生有什么启发？", "- 不要过度焦虑一次小失误的后果（虽然可能有影响但也可能被后续事件覆盖掉）", "- 但同时要做好应急预案——毕竟你不知道哪些小事可能会引发大问题", "### ⚡ 板书公式", "`微小的初始差 → 经过层层放大 → 巨大的结果差异 | 能控制的只是做好预案不追求完美预测`"], "formula": ""}, {"id": 34, "title": "T34：不可约性", "summary": "任何复杂事物都有一个\"不能再减\"的核心——去掉这个核心东西就变了味。先找到它再做别的。", "questions": "1. 一辆自行车最少需要哪些零件才能骑？如果把链条去掉还叫自行车吗？ 2. 一篇文章的核心论点是什么？去掉哪些段落不会影响主旨？", "story": "你用乐高搭了一栋大楼。拆掉最下面的几块楼塌了。但拆掉顶部的装饰小块楼还是楼。 **那些拆了就完蛋的部分叫做\"不可约的\"**，可以拆掉不影响整体的叫\"可选的\"。 很多人做事的问题是把时间花在\"可选\"上而忽略了\"不可约\"的核心。比如花大量时间美化PPT的动画效果（可选），却忘了内容的逻辑结构（不可约）。", "concepts": ["### ① 什么是不可约核心？", "一个系统中最基础、不能再去掉的部分——去掉它就\"不是原来的东西\"了。", "### ② 和奥卡姆剃刀的关系", "先用奥卡姆剃刀去掉所有不必要的部分 → 剩下的就是不可约的核心。这两个工具配合使用效果很好。", "### ③ 怎么找？", "逐步去掉一个组件或步骤 → 如果去掉后系统还能运作且基本功能不变 → 继续去掉下一个 → 直到某个点你发现\"再去就崩溃了\" → 那个点之前保留的就是不可约核心。", "### ④ 关键洞见", "很多系统被过度设计了——功能越来越多，核心反而模糊了。做减法比做加法更难也更有效。", "### ⚡ 板书公式", "`逐步去掉 → 还能用吗？→ 能继续去 | 不能用了 ← 这就是不可约核心`"], "formula": ""}, {"id": 35, "title": "T35：边际收益递减", "summary": "同样的努力做多了效果会越来越差——找到那个\"再多投入也不值了\"的点然后转去做别的。", "questions": "1. 你连续做数学题做了三个小时——前一个小时和后一小时的效果哪个更好？ 2. \"背单词从每天20个增加到50个、再到80个\"——哪个阶段效率最高？超过多少就不再划算了？", "story": "你饿了。吃第一个包子——好吃！第二个——还是很好。第三个——还行。第四个——有点撑了。第五个——不想吃了。第六个——硬塞下去反而想吐。 **每一个新包子带给你的满足感都在减少。** 这就是边际收益递减。 不是后面的包子不好吃，而是你已经饱了，每多吃一个获得的额外快乐越来越少。最后吃到负数（痛苦）。", "concepts": ["### ① 什么是边际收益？", "每增加一单位投入时获得的新增收益。比如多做一道题比之前多掌握的知识点数量。", "### ② 递减速率", "一开始增长很快（从不会到会），中间变慢（从会到熟练），最后几乎不增长了（从熟练到完美）。**大部分人在应该停止的时候还在拼命。**", "### ③ 关键洞见", "- **最优投入点出现在\"新增收益=新增成本\"的那个点上**——再投入就亏本了", "- **在什么时候停止和什么时候开始一样重要**——都要学会", "### ⚡ 板书公式", "`第一次投入 → 收获大 | 第N次 → 收获很小 → 到此为止！转向下一个高回报任务`"], "formula": ""}, {"id": 36, "title": "T36：分布", "summary": "平均数会骗人——看数据要看它的整体形状而不是只看一个数字。", "questions": "1. 你班上同学的零花钱如果只有几个同学特别多、大多数人差不多——这是什么样的分布？ 2. \"我们城市平均工资涨了\"——但如果只是极少数富豪的收入涨了很多其他人没变甚至少了这句话是真的吗？", "story": "A班和B班的数学平均分都是75分。但一看成绩表发现： - **A班**所有人都在72-78分之间（很集中） - **B班**有满分的也有不及格的（很分散） **同样的平均分，完全不同的分布。** 哪个班级更需要关注？需要什么样的干预措施？答案取决于你看的是哪一端的分数。 如果你只看平均分你会完全错过重要的信息。", "concepts": ["### ① 什么是分布？", "一组数据中各数值的排列方式和频率。常见的分布类型：", "- **正态分布**（钟形曲线）：大部分在中间两头少（如身高、考试分数的中等水平部分）", "- **偏态分布**：大多数值偏向一端（如收入——很多人少少数人多）", "- **幂律分布**（头部效应）：少数头部占绝大部分（如网红经济）", "### ② 关键洞见", "- **\"平均水平以上\"不代表你的表现很好**——取决于分布的形状", "- **有些领域遵循幂律分布**——少数头部占绝大部分，大部分人在尾部默默无闻", "- **只看一个平均数就像只看了一个人的体重却不知道他是高瘦还是矮胖**", "### ③ 怎么用？", "遇到任何统计数据时多问一句：\"这组数据的分布是什么样子？\"不要被平均数蒙蔽。", "### ⚡ 板书公式", "`不看分布的平均 = 盲人摸象 | 看分布才能看到真相 | 头部效应 ≠ 所有人都能赢`"], "formula": ""}, {"id": 37, "title": "T37：规模效应", "summary": "做得越大单位成本可能越低——但别超过最优规模否则会适得其反。", "questions": "1. 你是一个人认真学2小时效果好还是一起和三个同学学习2小时效果好？为什么？ 2. \"学校食堂打饭比外面餐馆便宜\"的原因里有没有规模效应？", "story": "小明在家做一个面包要面粉8元+电费0.5元+时间2小时。但如果他开了一家工厂一次烤1000个面包——每个面粉只要5元(批发)、电费分摊后几乎为零、机器代替了人工。 **同样的面粉买得越多单价越低——这就是规模效应。** 但在现实中，规模也不是越大越好。一个老师同时教10个班和教2个班——虽然看起来\"批量处理更高效\"但实际上教学质量会严重下降。这叫\"规模不经济\"。", "concepts": ["### ① 两种规模效应", "- **规模经济**：随着产量/规模的增加单位成本下降或效率提高", "- **规模不经济**：大到一定程度后管理成本太高效率反而降低", "### ② 关键洞见", "- **不是越大越好——有最优规模区间**", "- **在学习中也存在类似的效应**：学过的知识量越大新知识越容易吸收（正规模效应）；但同时注意力有限所以一次性塞太多也吸收不了（负规模效应）", "### ③ 怎么应用？", "在做任何规模化决策时先想清楚：当前是处于规模经济的上升段还是已经过了拐点进入规模不经济阶段？", "### ⚡ 板书公式", "`规模↑ → 单位成本↓(到某个点) → 再大 → 管理成本↑ → 得不偿失 | 找到最优规模是关键`"], "formula": ""}, {"id": 38, "title": "T38：网络效应", "summary": "一个东西越多人用就越好用——这就是为什么微信/抖音越来越强大，新出来的社交软件很难竞争。", "questions": "1. 如果你全世界只有一个人用微信它有用吗？如果所有人都在用它呢？ 2. \"QQ曾经是霸主但后来微信赢了\"——是微信比QQ好吗？还是用户已经都迁移到了微信？", "story": "你觉得为什么大家都用同一种语言交流？不是因为中文或英文在生物学意义上更优——而是因为**使用的人越多价值越大**。 你学会一门语言最大的好处不是语言本身多精妙而是和你懂这门语言的人越多你能交流的范围越大。这就是网络效应的威力。 同样的道理也适用于社交软件、编程语言、文件格式甚至流行文化。", "concepts": ["### ① 什么是网络效应？", "用户越多→价值越大→更多人加入→价值更大（正反馈循环）。", "梅特卡夫定律说网络的价值与用户数的平方成正比。所以一旦某个平台赢得了网络效应后来者几乎不可能超越。", "### ② 关键洞见", "- **用户基础本身就是最强的护城河**——技术可能更好体验可能更差但只要人多就会持续变强", "- **转换成本很高**——即使有更好的替代品也要考虑\"我的朋友们不在上面有什么用\"", "- **在人际关系中也存在网络效应**——认识的人越多你能获得的信息和资源就越多", "### ③ 怎么应对？", "作为个体面对已经形成的网络效应平台（如微信）你可以做的是利用它的优势而不是对抗它。但对于正在形成的网络选择早期进入可能更有利。", "### ⚡ 板书公式", "`人数↑ → 价值↑ → 更多人加入(正反馈) → 赢家通吃 | 换平台的成本 = 失去原有网络的价值`"], "formula": ""}, {"id": 39, "title": "T39：抽样", "summary": "不用问所有人也能知道大概情况——但前提是抽样的方法要科学。", "questions": "1. 如果学校调查同学们最喜欢的课间活动只在体育课上问正在打篮球的同学——这个调查结果可信吗？ 2. \"我问了10个朋友他们都觉得这道题很难\"——这说明这道题真的难吗？", "story": "你在一锅大汤里舀了一小勺尝尝味道——就这一口你就能判断整锅汤咸不咸。**你不需要喝完整锅汤才知道它好不好吃。** 这就是抽样的基本思想。 但如果勺子每次都从汤的最上面舀（盐都浮在上面）结果就不准了。**好的抽样要保证随机性和代表性。**", "concepts": ["### ① 什么是好的抽样？", "三个要素：**随机性**（每个人被抽到的概率相等）、**足够的量**（样本太小不准）、**有代表性**（不能只选特定群体）。", "### ② 怎么识别坏抽样？", "- **只问了喜欢自己班的人** → 偏见", "- **样本量太小**（只问了5个人就说代表全班）→ 不准", "- **时间地点不对**（只在课间问不活跃的男生）→ 无代表性", "### ③ 关键洞见", "- **抽样是了解世界的必备工具**——你不可能接触所有数据点", "- **差劲的抽样得出的结论比没有结论更危险**——因为它看起来很科学但实际上误导人", "### ⚡ 板书公式", "`好抽样 = 随机的 + 够多的 → 结论可靠 | 差抽样 = 挑着选的/太少的 → 结论不可信`"], "formula": ""}, {"id": 40, "title": "T40：等价替换", "summary": "达到同样目的可以有很多不同的方式——如果一条路走不通试试换个思路可能发现更优解。", "questions": "1. \"表达感谢\"可以用哪些方式？除了说谢谢以外还有什么？ 2. 一道数学题你有两种解法，哪种更好？怎么判断？", "story": "从家到学校有A、B、C三条路：A最快但人多拥挤，B风景好但远一些，C要过马路但不堵。**它们都是\"去学校\"这个目标的可行方案——本质上是等价的只是各自的优缺点不同。** 有时候我们发现\"只有一条路可走\"是因为我们只看到了一条路。等价替换思维就是帮你找到更多可能的路。", "concepts": ["### ① 什么是等价替换？", "找到一个与当前方案不同但效果相同的替代方案。不是随便找个类似的东西而是真正能达到同样目的的不同方式。", "### ② 怎么用好这个思维？", "**明确目标**（你到底要达成什么？）", "**列出所有已知的方法**", "** brainstorming 新的方法**（哪怕看起来很荒谬）", "**评估每种方法的优劣并选择最合适的**", "### ③ 关键洞见", "- **创新往往来自于发现了新的等价替代方案**", "- **不是所有替换都等价——要仔细验证新方案是否真的能达到同样的目的**", "- **有时候最优解不在你已有的知识库里需要创造新的**", "### ⚡ 板书公式", "`方法A达成目标G → 是否存在方法B也达成G且更好？→ 找到！→ 替换！`"], "formula": ""}, {"id": 41, "title": "T41：数量级", "summary": "差的不是几个，差的是好几倍——用\"多少个零\"来理解大数字之间的差异比精确数字直观多了。", "questions": "1. \"中国有14亿人\"和\"我们学校有2000人\"——这两个数字对日常生活的影响有什么不同？ 2. 你觉得地球上的沙子粒数和全宇宙的星星数量哪个更大？你怎么知道答案而不是瞎猜？", "story": "一只蚂蚁约重0.003克，一头大象约重5000公斤。它们相差多少倍？ **差不多17亿倍（9个数量级）**。你想想看——这不仅仅是\"很多\"，这是完全不同的维度。如果你是一只蚂蚁，你觉得所有人类加起来的重量可能还不如一头小象重。 为什么这个对比很重要？因为我们经常用线性思维去想象指数级的差距。1万和10万之间差了9万看起来不少——但在感受上差了整整十倍！", "concepts": ["### ① 什么是数量级？", "就是\"一个数大约有几个零\"。10¹=十、10²=百、10³=千、10⁴=万...每过一个台阶就翻10倍。", "### ② 为什么需要它？", "很多问题不需要精确答案——你知道它是百万级别还是亿级别就够了。这决定了你的态度和资源投入。", "### ③ 关键洞见", "- **两个数只差一点点但数量级不同→这是完全不同的东西**（比如1万和10万虽然差9万但在感受上差了整整十倍）", "- **在决策中我们经常犯的错误是用线性思维处理指数级的差异**", "### ⚡ 板书公式", "`10¹十 | 10²百 | 10³千 | 10⁴万 | 10⁵十万 | 10⁶百万 → 每过一个台阶翻10倍`"], "formula": ""}];

var C=document.getElementById("c");
function pad(n){return String(n).padStart(2,"0");}
function clean(t){
 if(!t)return"";
 // remove all formatting symbols - show natural language only
 t=t.replace(/&amp;/g,"&");
 t=t.replace(/&lt;/g,"<");
 t=t.replace(/&gt;/g,">");
 t=t.replace(/\\n/g," ");      // \n → space
 t=t.replace(/\"/g,"");         // escape quotes
 t=t.replace(/^#{1,5}\s+/gm,""); // ### → nothing
 t=t.replace(/\*\*/g,"");       // **bold** → nothing
 t=t.replace(/`/g,"");           // `code` → nothing
 t=t.replace(/[-*]\s/g," ");    // list bullets → space
 return t;
}
function R(){
 var s=Math.max(1,parseInt(document.getElementById("s").value)||1);
 var e=Math.min(41,parseInt(document.getElementById("e").value)||Math.min(7,41));
 if(s>e){var t=s;s=e;e=t;}
 C.innerHTML="";
 for(var i=s;i<=e&&i<=D.length;i++){
  var x=D[i-1];if(!x)continue;
  var icon=I[x.id-1]||'';
  var h='<div class="card">'
   +'<div class="chdr"><span class="ctitle">'+clean(x.title)+' T'+pad(x.id)+(icon?' '+icon:'')+'</span></div>'
   +'<div class="oneline">'+clean(x.summary)+'</div>'
   +'<div class="stitle">先想一想</div>'
   +'<div class="txt">'+clean(x.questions)+'</div>'
   +'<div class="story">'+clean(x.story)+'</div>'
   +'<div class="stitle">核心概念</div>';
  if(x.concepts&&x.concepts.length){
   h+='<ul class="cl">';
   for(var j=0;j<x.concepts.length;j++)
    h+='<li data-num="'+(j+1)+'">'+clean(x.concepts[j])+'</li>';
   h+='</ul>';}
  if(x.formula) h+='<div class="fbg">板书公式：'+clean(x.formula)+'</div>';
  h+='<div class="foot">下一张:T'+pad(i+1)+(i>=D.length?'【完】':'</div>');
  C.innerHTML+=h;
 }
}
